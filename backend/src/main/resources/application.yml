server:
  port: 8080

mqtt:
  broker: tcp://mosquitto:1883   # w docker-compose nazwa serwisu brokera to "mosquitto"
  clientId: backend-client
  topic: sensors/esp32_1/soil

spring:
  application:
    name: plantpot-backend
  datasource:
    url: jdbc:h2:file:./data/plantpotdb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
      #ddl-auto: none
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true